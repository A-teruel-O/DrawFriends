<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dibuja de memoria</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
html,body{overscroll-behavior:none}
:root{--bg:#eef2ff;--ink:#1b1b2f;--card:#fff;--acc:#ff4d6d;--sun:#ffd23f;--mut:#6b6f8a}
@media(prefers-color-scheme:dark){:root{--bg:#14152a;--ink:#f1f2ff;--card:#1f2040;--mut:#9a9dc0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto}
h1{font-size:2.2rem;font-weight:800;margin:.2em 0;line-height:1.05}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav b{font-weight:800}
button,input{font:inherit;color:inherit}
button{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:800}
button.p{background:var(--acc);color:#fff}
button:disabled{opacity:.35}
input{width:100%;padding:12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);margin:6px 0 12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-bottom:14px}
.word{font-size:2.6rem;font-weight:800;text-align:center;margin:8px 0;word-break:break-word}
.cat{text-align:center;color:var(--mut)}
canvas{width:100%;aspect-ratio:1;background:#fff;border:2px solid var(--ink);border-radius:14px;touch-action:none;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid var(--card);outline:2px solid var(--ink)}
.sw.on{outline:4px solid var(--acc)}
.t{font-size:2rem;font-weight:800;text-align:center;color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid figure{margin:0}
.grid img{width:100%;border:2px solid var(--ink);border-radius:12px;background:#fff;display:block}
.grid figcaption{text-align:center;font-weight:800}
.ref{width:100%;max-width:220px;display:block;margin:8px auto}
.mut{color:var(--mut);text-align:center}
a{color:var(--acc);font-weight:800}
[hidden]{display:none!important}
.car{display:flex;gap:6px;align-items:center}.car button{padding:16px 10px}
.sl{flex:1;height:min(64vh,540px);overflow:auto;border:2px solid var(--ink);border-radius:14px;padding:10px;background:var(--bg)}
.sl img{width:100%;border:2px solid var(--ink);border-radius:12px;background:#fff;display:block}.sl h3{margin:8px 0 4px}.sl p{margin:4px 0}
.sz i{display:block;background:currentColor;border-radius:50%}.act{background:var(--sun)!important}
.panel{border:2px solid var(--ink);border-radius:14px;padding:10px;margin:8px 0;background:var(--bg)}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button.on{background:var(--sun);color:#1b1b2f}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.pal .sw{width:100%;height:auto;aspect-ratio:1;border-radius:8px}
#pw{text-align:center}#wc{width:200px;height:200px;aspect-ratio:1;border-radius:50%;border:2px solid var(--ink);cursor:crosshair}#pw input{width:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sl .pair img{aspect-ratio:1;object-fit:contain;background:#fff}.lbl{display:grid;grid-template-columns:1fr 1fr;text-align:center;color:var(--mut);margin:2px 0 6px}
.tw{position:relative}.panel{position:absolute;bottom:calc(100% + 6px);left:0;width:min(100%,290px);z-index:5;margin:0;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pal{gap:0}.pal .sw{border:0;outline:0;border-radius:0}#wc{width:160px;height:160px}
.tools{flex-wrap:nowrap;gap:5px}.tools>button{padding:6px 8px;font-size:.85rem}.tools>.sw{width:30px;height:30px;padding:0;flex:none}
.lg{width:100%;border-collapse:collapse;margin-top:8px}.lg th{font-weight:500;color:var(--mut);text-align:right}.lg td{text-align:right;padding:4px 0}.lg th:nth-child(2),.lg td:nth-child(2){text-align:left;padding-left:6px}.lg td:first-child{text-align:left;color:var(--mut)}
.pal{grid-template-columns:repeat(10,1fr)}.panel{width:min(100%,260px)}
.dw{position:relative}.dl{position:absolute;top:6px;right:6px;opacity:.55;padding:1px 6px;border-radius:8px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:.8rem}
.plus{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;padding:0;border-radius:50%;font-size:1.2rem;line-height:1;background:var(--card)}
.chips{position:absolute;left:4px;bottom:4px;right:26px;display:flex;flex-wrap:wrap;gap:3px}
.chip{background:rgba(255,255,255,.88);color:#1b1b2f;border:1px solid #1b1b2f;border-radius:10px;padding:0 6px;font-size:.8rem;font-weight:800}
.ep{position:absolute;right:0;bottom:30px;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px}
.ep button{border:0;padding:4px;font-size:1.25rem;background:none}
.car>button{padding:16px 10px}
.sl{height:auto;overflow:visible;border:0;padding:0;background:none}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}.gh b{text-align:center}.gh button{padding:8px 16px}
.stk{display:flex;flex-direction:column;align-items:center;gap:8px}
.dw{position:relative;width:min(100%,30svh)}.stk .im{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:2px solid var(--ink);border-radius:12px;display:block}
.tag{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.4);color:#fff;font-size:.75rem;padding:1px 8px;border-radius:10px}
.plus,.dl{position:absolute;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;line-height:1;font-weight:800;color:#fff;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.6)}
.plus{right:6px;bottom:6px;width:32px;height:32px;font-size:1.4rem}.dl{top:6px;right:6px;width:28px;height:28px;font-size:.9rem;opacity:.75}
.ep{bottom:44px;right:6px}.ep button{padding:4px}
.fs{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:6px;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
.fh{display:flex;justify-content:space-between;align-items:center;font-size:1.3rem}.fh .t{font-size:1.5rem}
.cw{flex:1;min-height:0;position:relative}#c{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto}.fs .tools{margin:0}
.cw{display:flex;align-items:center;justify-content:center}
#c{position:static;border:0;border-radius:12px;box-shadow:0 0 0 2px var(--ink);flex:none;aspect-ratio:auto}
.fh{position:static}.fh b,.fh .t{background:none;padding:0;color:var(--ink)}.fh .t{color:var(--acc)}
.fb{position:static;display:flex;flex-direction:column;gap:6px}.fb .tools{justify-content:center}.fb .p{padding:8px}
.dd{width:auto;max-width:100%}.dd .im{width:auto;max-width:100%;max-height:36svh;aspect-ratio:auto;object-fit:contain}
.nav{position:relative}.dmb{border:0;background:none;font-weight:800;font-size:1rem;padding:6px 10px}
.dlp{position:absolute;top:100%;left:0;right:0;max-height:55vh;overflow:auto;z-index:8;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px;display:grid;gap:6px}
.rt{display:flex;gap:8px;margin-bottom:10px}.rt button{flex:1}.rt .act{color:#1b1b2f}.lg{font-size:.92rem}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ====== CONFIGURACIÓN (pega aquí tus datos de Supabase) ====== */
const SUPABASE_URL = "https://bqyjiazhnickpnzmtzlm.supabase.co";      // https://xxxx.supabase.co
const SUPABASE_KEY = "sb_publishable_6NK5hhXDrdUlIl6SKoL1JQ_3ZkxFw4Q"; // clave "anon public"
const PLAYERS = 3;      // cuántos sois
const SECONDS = 120;    // tiempo para dibujar
/* ============================================================== */

const POKE = "Bulbasaur,Ivysaur,Venusaur,Charmander,Charmeleon,Charizard,Squirtle,Wartortle,Blastoise,Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,Ekans,Arbok,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran♀,Nidorina,Nidoqueen,Nidoran♂,Nidorino,Nidoking,Clefairy,Clefable,Vulpix,Ninetales,Jigglypuff,Wigglytuff,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,Tentacruel,Geodude,Graveler,Golem,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,Chansey,Tangela,Kangaskhan,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx,Electabuzz,Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew".split(",");

const $ = s => document.querySelector(s), app = $("#app");
const ls = (k,v) => v===undefined ? localStorage.getItem(k) : localStorage.setItem(k,v);
const H = {apikey:SUPABASE_KEY, "Content-Type":"application/json"}; if(!SUPABASE_KEY.startsWith("sb_")) H.Authorization="Bearer "+SUPABASE_KEY;

function shuffled(arr, seed){ const a=arr.slice(); let s=seed;
  const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; }
const shufCache={};
const hashS=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const today = () => { const d=new Date(); return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); };
const dayKey = n => new Date(n*864e5).toISOString().slice(0,10);
function itemFor(n,room){ const P=shufCache[room]??=shuffled(POKE.map((x,i)=>({n:x,i:i+1})),hashS(room)); const p=P[((n%P.length)+P.length)%P.length];
  return {cat:"Pokémon", name:p.n, img:`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.i}.png`}; }

async function getDrawings(day){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/drawings?room=eq.${encodeURIComponent(ls("room"))}&day=eq.${dayKey(day)}&select=name,img&order=created_at`, {headers:H});
  if(!r.ok) throw new Error("No se pudo leer"); return r.json(); }
async function send(day, img, crop){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/drawings`, {method:"POST", headers:{...H,Prefer:"return=minimal"},
    body:JSON.stringify({room:ls("room"), day:dayKey(day), name:ls("name"), img, crop})});
  if(!r.ok && r.status!==409) throw new Error("No se pudo enviar"); }

let view = today(), timer=null, poll=null, rid=0;
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setup(){
  if(SUPABASE_URL.startsWith("PEGA")){ app.innerHTML=`<div class="card"><h1>Falta configurar</h1><p>Abre el archivo y pega tu URL y tu clave de Supabase arriba del todo.</p></div>`; return; }
  app.innerHTML=`<h1>Dibuja de memoria</h1><div class="card"><label>Tu nombre<input id="n" maxlength="20" value="${esc(ls("name")||"")}"></label>
  <label>Código de sala (el mismo para todos)<input id="r" maxlength="30" value="${esc(ls("room")||"")}"></label><button class="p" id="go">Entrar</button></div>`;
  $("#go").onclick=()=>{const n=$("#n").value.trim(), r=$("#r").value.trim().toLowerCase(); if(!n||!r) return; ls("name",n); ls("room",r); render();};
}

async function render(){
  const my=++rid;
  clearInterval(timer); clearInterval(poll); clearInterval(cTimer); lastSig=""; cur=0; auto=true; document.body.style.overflow="";
  if(!ls("name")||!ls("room")) return setup();
  const t=today(); if(view>t) view=t; let start=t;
  try{ const r=await (await fetch(`${SUPABASE_URL}/rest/v1/drawings?room=eq.${encodeURIComponent(ls("room"))}&select=day&order=day.asc&limit=1`,{headers:H})).json(); if(r[0]) start=Math.min(t,Math.round(Date.parse(r[0].day)/864e5)); }catch(e){}
  if(my!==rid) return;
  if(view<start) view=start; if(view>t) view=t;
  const v=view, it=itemFor(v-start,ls("room"));
  let days=""; for(let d=t;d>=start;d--) days+=`<button data-d="${d}" class="${d===v?"act":""}">Día ${d-start+1} · ${esc(itemFor(d-start,ls("room")).name)}</button>`;
  app.innerHTML=`<div class="nav"><button id="b" ${v<=start?"disabled":""}>‹</button><button id="dm" class="dmb">${v===t?"Hoy · ":""}Día ${v-start+1} ▾</button><button id="f" ${v>=t?"disabled":""}>›</button><div id="dl" class="dlp" hidden>${days}</div></div><div id="body"><p class="mut">Cargando…</p></div><div id="rank"></div>
  <p class="mut">${esc(ls("name"))} · sala ${esc(ls("room"))} · <a href="#" id="out">cambiar</a></p>`;
  $("#b").onclick=()=>{$("#b").disabled=$("#f").disabled=true;view=Math.max(start,v-1);render()}; $("#f").onclick=()=>{$("#b").disabled=$("#f").disabled=true;view=Math.min(t,v+1);render()};
  $("#dm").onclick=()=>{$("#dl").hidden=!$("#dl").hidden};
  $("#dl").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=Math.min(t,Math.max(start,+b.dataset.d));render()}; $("#out").onclick=e=>{e.preventDefault();setup()};
  let list; try{ list=await getDrawings(v);}catch(e){ if(my!==rid) return; $("#body").innerHTML=`<div class="card">No se pudo conectar. Revisa la configuración de Supabase.</div>`; return; }
  if(my!==rid) return;
  const mine = list.some(d=>d.name===ls("name"));
  const key="start:"+ls("room")+dayKey(v)+ls("name"), started=ls(key);
  if(v===t && !mine){
    if(!started){
      $("#body").innerHTML=`<div class="card"><p class="cat">${it.cat}</p><div class="word">${esc(it.name)}</div><p class="mut">${SECONDS} segundos. Solo un intento al día, y de memoria.</p><button class="p" id="s" style="width:100%">Empezar</button></div>`;
      $("#s").onclick=()=>{ls(key,Date.now());try{localStorage.removeItem("draft:"+key.slice(6))}catch(e){}render()}; ranking(); return; }
    return draw(it,key,+started);
  }
  gallery(it,list,my); poll=setInterval(async()=>{try{const l=await getDrawings(v); if(my===rid) gallery(it,l,my)}catch(e){}},8000);
}

let judging=false,lastSig="",lastTry=0,jerr="",cur=0,auto=true,cTimer=null,G={list:[],sc:[],it:null},RX=[],popup=false;
const EM=["😂","🔥","💀","😍","👏","😭","🤔","🤡"];
const fmt=n=>Number(n).toFixed(1).replace(".",",");
function itemHTML(i){
  const d=G.list[i],s=G.sc.find(x=>x.name===d.name),it=G.it,cnt={};
  RX.filter(r=>r.to_name===d.name).forEach(r=>cnt[r.emoji]=(cnt[r.emoji]||0)+1);
  const chips=Object.entries(cnt).map(([e,n])=>`<span class="chip">${e} ${n}</span>`).join("");
  return `<div class="stk"><div class="dw"><img class="im" src="${it.img}" alt="${esc(it.name)}"><span class="tag">Real</span></div>
    <div class="dw dd"><img class="im" src="${d.img}" alt="Dibujo"><span class="tag">Dibujo</span>
    <button class="dl" data-dl title="Descargar" aria-label="Descargar dibujo">⬇</button><div class="chips">${chips}</div>
    <button class="plus" data-plus aria-label="Reaccionar">+</button>
    <div class="ep" ${popup?"":"hidden"}>${EM.map(e=>`<button data-em="${e}">${e}</button>`).join("")}</div></div></div>
    <h3 style="text-align:center;margin:10px 0 4px">${esc(d.name)}${s?` · ${fmt(s.nota)}`:""}</h3>
    ${s?`<p>${esc(s.motivo)}</p><p><i>${esc(s.comentario)}</i></p>`:`<p class="mut">La IA está puntuando…${jerr?`<br>Error: ${esc(jerr)}`:""}</p>`}`;
}
function slide(){const e=$("#sl"); if(!e||!G.list.length) return; const d=G.list[cur],s=G.sc.find(x=>x.name===d.name);
  e.innerHTML=itemHTML(cur); $("#ttl").textContent=(cur+1)+" / "+G.list.length;}
function go(d){ if(!G.list.length) return; popup=false; cur=(cur+d+G.list.length)%G.list.length; slide(); }
async function gallery(it,list,tok){
  if(!$("#body")||tok!==rid) return;
  if(view>today()) return; // nunca se muestra nada del día siguiente
  if(view===today() && !list.some(d=>d.name===ls("name"))){ $("#body").innerHTML=`<div class="card"><p class="mut">Dibuja primero para ver esto.</p></div>`; return; }
  const done=list.length>0;
  let sc=[],rx=[];
  if(done){
    const q=`room=eq.${encodeURIComponent(ls("room"))}&day=eq.${dayKey(view)}`;
    try{ sc=await (await fetch(`${SUPABASE_URL}/rest/v1/scores?${q}&select=name,nota,motivo,comentario`,{headers:H})).json(); }catch(e){}
    try{ rx=await (await fetch(`${SUPABASE_URL}/rest/v1/reactions?${q}&select=to_name,emoji`,{headers:H})).json(); }catch(e){}
    if(!Array.isArray(sc)) sc=[]; if(!Array.isArray(rx)) rx=[];
    if(tok!==rid) return;
    if(sc.length<list.length && !judging && Date.now()-lastTry>30000){ judging=true; lastTry=Date.now(); jerr="";
      fetch(`${SUPABASE_URL}/functions/v1/judge`,{method:"POST",headers:H,body:JSON.stringify({room:ls("room"),day:dayKey(view),item:it.name,ref:it.img})})
        .then(r=>r.json()).then(j=>{if(!j.ok) jerr=j.error||j.reason||"error desconocido"})
        .catch(()=>{jerr="No se pudo llamar a la función judge (¿está creada y con Verify JWT desactivado?)"})
        .finally(()=>{judging=false;lastSig=""}); }
  }
  const sig=list.length+"|"+sc.length+"|"+rx.length+"|"+jerr+"|"+view; if(sig===lastSig) return; lastSig=sig;
  const b=$("#body"); if(!b) return;
  G={list:done?list:[],sc,it}; RX=rx; popup=false;
  b.innerHTML=`<div class="card"><div class="word" style="font-size:1.7rem;margin:0 0 6px">${esc(it.name)}</div>
  ${done?`<div class="gh"><button id="pv">‹</button><b id="ttl"></b><button id="nx">›</button></div><div id="sl" class="sl"></div>${list.length<PLAYERS&&view===today()?`<p class="mut">Han enviado ${list.length} de ${PLAYERS}. Los demás aparecerán en cuanto dibujen.</p>`:""}`
  :`<p class="mut">Nadie dibujó este día.</p>`}</div>`;
  if(done){ cur=Math.min(cur,list.length-1); const sl=$("#sl"); $("#pv").onclick=()=>go(-1); $("#nx").onclick=()=>go(1); slide();
    sl.onclick=async e=>{ const t=e.target.closest("button"); if(!t) return; const d=G.list[cur];
      if(t.dataset.dl!==undefined){ const a=document.createElement("a"); a.href=d.img; a.download=`${G.it.name}-${d.name}.jpg`.replace(/[^\w.-]+/g,"_"); a.click(); return; }
      if(t.dataset.plus!==undefined){ popup=!popup; slide(); return; }
      if(t.dataset.em){ popup=false; const r={to_name:d.name,emoji:t.dataset.em}; RX.push(r); slide();
        try{ const res=await fetch(`${SUPABASE_URL}/rest/v1/reactions`,{method:"POST",headers:{...H,Prefer:"return=minimal"},body:JSON.stringify({room:ls("room"),day:dayKey(view),to_name:r.to_name,emoji:r.emoji,by_name:ls("name")})}); if(!res.ok) throw 0; }
        catch(err){ RX.splice(RX.indexOf(r),1); slide(); } } };
  }
  if(sc.length) ranking();
}

let rtab="w",RK={};
function showRank(){
  const el=$("#rank"); if(!el||!RK.w) return;
  el.innerHTML=`<div class="rt"><button data-rt="w" class="${rtab==="w"?"act":""}">Tabla semanal</button><button data-rt="t" class="${rtab==="t"?"act":""}">Tabla total</button></div>${RK[rtab]}`;
  el.onclick=e=>{const b=e.target.closest("[data-rt]"); if(b){rtab=b.dataset.rt; showRank()}};
}
async function ranking(){
  try{
    const r=await (await fetch(`${SUPABASE_URL}/rest/v1/scores?room=eq.${encodeURIComponent(ls("room"))}&select=name,day,nota`,{headers:H})).json();
    if(!Array.isArray(r)) return;
    const td=dayKey(today()), num=d=>Math.round(Date.parse(d)/864e5), wk=d=>dayKey(num(d)-((new Date(num(d)*864e5).getUTCDay()+6)%7)); // semanas de lunes a domingo
    const cw=wk(td), byDay={}, W={}, T={}, hist=[], get=(w,n)=>((W[w]??={})[n]??={p:0,w:0,s:0,c:0,b:0}), avg=o=>Math.round(o.s/o.c*100)/100;
    r.forEach(x=>{const v=Number(x.nota),o=get(wk(x.day),x.name);o.s+=v;o.c++;o.b=Math.max(o.b,v);(byDay[x.day]??=[]).push({n:x.name,v})});
    Object.entries(byDay).forEach(([day,arr])=>{ // puntos por posición cada día (el de hoy cuenta cuando hayáis terminado todos)
      if(day>=td&&arr.length<PLAYERS) return; arr.sort((a,b)=>b.v-a.v); let i=0;
      while(i<arr.length){let j=i;while(j+1<arr.length&&arr[j+1].v===arr[i].v)j++;let sum=0;for(let k=i;k<=j;k++)sum+=Math.max(0,PLAYERS-k);const n=j-i+1;
        for(let k=i;k<=j;k++){const o=get(wk(day),arr[k].n);o.p+=sum/n;if(i===0)o.w+=1/n}i=j+1}});
    Object.keys(W).sort().forEach(w=>{ const rows=Object.entries(W[w]);
      rows.forEach(([n,o])=>{const t=T[n]??={p:0,w:0,s:0,c:0,b:0,wins:0};t.p+=o.p;t.w+=o.w;t.s+=o.s;t.c+=o.c;t.b=Math.max(t.b,o.b)});
      if(w>=cw) return; const best=Math.max(...rows.map(([,o])=>o.p)); if(best<=0) return; // semana cerrada: gana quien más puntos tenga; empate: mejor media
      const top=rows.filter(([,o])=>o.p===best), bm=Math.max(...top.map(([,o])=>avg(o))), win=top.filter(([,o])=>avg(o)===bm);
      win.forEach(([n])=>T[n].wins++); hist.push({w,win:win.map(([n])=>n),p:best})});
    const f=n=>String(+n.toFixed(1)).replace(".",","), fd=d=>new Date(num(d)*864e5).toLocaleDateString("es-ES",{day:"numeric",month:"short",timeZone:"UTC"});
    const cur=Object.entries(W[cw]??{}).sort((a,b)=>b[1].p-a[1].p||avg(b[1])-avg(a[1])), left=num(cw)+6-today();
    const tot=Object.entries(T).sort((a,b)=>b[1].wins-a[1].wins||b[1].p-a[1].p||avg(b[1])-avg(a[1]));
    RK.w=`<div class="card"><b>Esta semana</b> <span class="mut">(${fd(cw)} – ${fd(dayKey(num(cw)+6))})</span>
    ${cur.length?`<table class="lg"><tr><th></th><th>Jugador</th><th>Pts</th><th>Vic</th><th>Media</th><th>Mejor</th></tr>${cur.map(([n,o],i)=>`<tr><td>${i+1}</td><td>${esc(n)}</td><td><b>${f(o.p)}</b></td><td>${f(o.w)}</td><td>${f(avg(o))}</td><td>${f(o.b)}</td></tr>`).join("")}</table>`:`<p class="mut">Aún no hay puntuaciones esta semana.</p>`}
    <p class="mut" style="font-size:.85rem;text-align:left">${left>0?`Se cierra el domingo (quedan ${left} día${left===1?"":"s"} después de hoy).`:"Hoy es el último día: se cierra al acabar el día."} Pts: ${PLAYERS} al 1º cada día, uno menos por puesto, 0 si no dibujas. Vic: días ganados. El día de hoy cuenta cuando hayáis terminado todos.</p></div>`;
    RK.t=`<div class="card"><b>Total</b> <span class="mut">(desde el principio)</span>
    ${tot.length?`<table class="lg"><tr><th></th><th>Jugador</th><th>🏆</th><th>Pts</th><th>Vic</th><th>Media</th><th>Mejor</th></tr>${tot.map(([n,o],i)=>`<tr><td>${i+1}</td><td>${esc(n)}</td><td><b>${o.wins}</b></td><td>${f(o.p)}</td><td>${f(o.w)}</td><td>${f(avg(o))}</td><td>${f(o.b)}</td></tr>`).join("")}</table>`:`<p class="mut">Aún no hay datos.</p>`}
    <p class="mut" style="font-size:.85rem;text-align:left">🏆: semanas ganadas (se ordena por esto y, si hay empate, por puntos). Pts: puntos por posición de todos los días. Vic: días ganados.</p>
    ${hist.length?`<p class="mut" style="text-align:left;margin-bottom:2px">Semanas cerradas:</p>${hist.slice().reverse().map(h=>`<div>Semana del ${fd(h.w)}: <b>${h.win.map(esc).join(" y ")}</b> · ${f(h.p)} pts</div>`).join("")}<p class="mut" style="font-size:.85rem;text-align:left">Gana la semana quien más puntos tenga; si hay empate, la mejor media; si siguen empatados, ganan los dos.</p>`:`<p class="mut" style="font-size:.85rem;text-align:left">Cuando acabe la primera semana saldrá aquí su ganador.</p>`}</div>`;
    showRank();
  }catch(e){}
}

const hsl=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return "#"+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join("")};
const R10=fn=>[...Array(10)].map((_,i)=>fn(i));
const PAL=R10(i=>hsl(0,0,100-i*100/9)).concat([[0,85],[28,90],[52,95],[130,65],[175,70],[215,85],[270,65],[325,80]].flatMap(([h,sat])=>R10(i=>hsl(h,sat,92-i*8))),R10(i=>hsl(25,45,85-i*7)));
function rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round((v-v*s*Math.max(0,Math.min(k,4-k,1)))*255)};return[f(5),f(3),f(1)]}
const hex=c=>"#"+c.map(n=>n.toString(16).padStart(2,"0")).join("");
function wheel(cv,v){const c=cv.getContext("2d"),n=cv.width,R=n/2,im=c.createImageData(n,n);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const dx=x-R,dy=y-R,r=Math.hypot(dx,dy);if(r>R)continue;const i=(y*n+x)*4,k=rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,r/R,v);im.data[i]=k[0];im.data[i+1]=k[1];im.data[i+2]=k[2];im.data[i+3]=255}
  c.putImageData(im,0,0)}

function flood(x,sx,sy,hc,W,H){
  const im=x.getImageData(0,0,W,H),d=im.data;sx=Math.floor(sx);sy=Math.floor(sy);
  const N=W*H,s0=sy*W+sx,i0=s0*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2],c=[1,3,5].map(k=>parseInt(hc.slice(k,k+2),16));
  if(Math.abs(tr-c[0])+Math.abs(tg-c[1])+Math.abs(tb-c[2])<10) return;
  const m=new Uint8Array(N); for(let p=0;p<N;p++){const i=p*4;m[p]=Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<=90?1:0}
  // Se engordan las líneas R píxeles para cerrar huecos pequeños y que la pintura no se escape.
  const R=4; let bl=new Uint8Array(N); for(let p=0;p<N;p++) bl[p]=m[p]?0:1;
  for(let k=0;k<R;k++){const nb=bl.slice();for(let y=0;y<H;y++)for(let u=0;u<W;u++){const p=y*W+u;if(bl[p])continue;if((u>0&&bl[p-1])||(u<W-1&&bl[p+1])||(y>0&&bl[p-W])||(y<H-1&&bl[p+W]))nb[p]=1}bl=nb}
  const seedOk=!bl[s0], A=new Uint8Array(N); for(let p=0;p<N;p++) A[p]=seedOk?(bl[p]?0:1):m[p]; // si pulsas pegado a una línea, relleno normal
  const reg=new Uint8Array(N),st=[s0];
  while(st.length){const p=st.pop();if(reg[p]||!A[p])continue;reg[p]=1;const u=p%W;if(u>0)st.push(p-1);if(u<W-1)st.push(p+1);if(p>=W)st.push(p-W);if(p<N-W)st.push(p+W)}
  if(seedOk) for(let k=0;k<=R;k++){const add=[];for(let y=0;y<H;y++)for(let u=0;u<W;u++){const p=y*W+u;if(reg[p]||!m[p])continue;if((u>0&&reg[p-1])||(u<W-1&&reg[p+1])||(y>0&&reg[p-W])||(y<H-1&&reg[p+W]))add.push(p)}add.forEach(p=>reg[p]=1)}
  for(let p=0;p<N;p++) if(reg[p]){const i=p*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}
  x.putImageData(im,0,0)}

// Recorte del dibujo (mismo tamaño para todos) que ve la IA, para que el tamaño no influya en la nota.
function cropOf(cv,x,W,H){
  const d=x.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let u=0;u<W;u++){const p=(y*W+u)*4;if(d[p]<250||d[p+1]<250||d[p+2]<250){if(u<x0)x0=u;if(u>x1)x1=u;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<0) return null;
  const mg=Math.round(Math.max(x1-x0,y1-y0)*0.06)+6;x0=Math.max(0,x0-mg);y0=Math.max(0,y0-mg);x1=Math.min(W-1,x1+mg);y1=Math.min(H-1,y1+mg);
  const w=x1-x0+1,h=y1-y0+1,sc=512/Math.max(w,h),o=document.createElement("canvas");o.width=Math.round(w*sc);o.height=Math.round(h*sc);
  const c=o.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,o.width,o.height);c.drawImage(cv,x0,y0,w,h,0,0,o.width,o.height);return o.toDataURL("image/jpeg",0.7);}

function draw(it,key,start){
  $("#body").innerHTML=`<div class="fs"><div class="fh"><b>${esc(it.name)}</b><span class="t" id="tm"></span></div><div class="cw" id="cw"><canvas id="c"></canvas></div><div class="fb"><div class="tools tw"><button id="cb" class="sw" style="background:#000000" title="Colores"></button>
   <button class="sz" data-s="4"><i style="width:5px;height:5px"></i></button><button class="sz act" data-s="10"><i style="width:10px;height:10px"></i></button><button class="sz" data-s="24"><i style="width:20px;height:20px"></i></button>
   <button id="fl" title="Cubo" aria-label="Cubo">🪣</button><button id="er" title="Goma" aria-label="Goma">🧽</button><button id="u" title="Deshacer" aria-label="Deshacer">↩</button><button id="rd" title="Rehacer" aria-label="Rehacer">↪</button><button id="cl" title="Borrar todo" aria-label="Borrar todo">🗑️</button>
  <div id="pn" class="panel" hidden><div class="tabs"><button data-t="p" class="on">Paleta</button><button data-t="w">Círculo</button></div>
   <div id="pp" class="pal"></div><div id="pw" hidden><canvas id="wc" width="180" height="180"></canvas><input type="range" id="bv" min="10" max="100" value="100" aria-label="Brillo"></div></div></div>
  <button class="p" id="ok" style="width:100%">Enviar ya</button></div></div>`;
  const cv=$("#c"),cw=$("#cw"); document.body.style.overflow="hidden";
  const bb=cw.getBoundingClientRect(); let cw2=Math.max(50,bb.width-4),ch2=Math.max(50,bb.height-4),ratio=Math.min(1.2,ch2/cw2);
  if(ratio<1){cw2=Math.min(cw2,ch2);ratio=1}
  const W=600,H=Math.round(600*ratio); cv.width=W; cv.height=H; cv.style.width=cw2+"px"; cv.style.height=Math.round(cw2*ratio)+"px"; const x=cv.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.lineCap=x.lineJoin="round";
  let col="#000000",w=10,erase=false,fill=false,on=false,hist=[],redo=[],lx=0,ly=0,H0=0,S0=1,V0=1,picked=false;
  const setCol=c=>{col=c;erase=false;$("#cb").style.background=c;$("#er").classList.remove("act")};
  $("#pp").innerHTML=PAL.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("");
  $("#pp").onclick=e=>{const b=e.target.closest("button"); if(b){setCol(b.dataset.c);$("#pn").hidden=true}};
  $("#cb").onclick=()=>{$("#pn").hidden=!$("#pn").hidden};
  const wc=$("#wc"); wheel(wc,1);
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(t=>t.classList.toggle("on",t===b));$("#pp").hidden=b.dataset.t!=="p";$("#pw").hidden=b.dataset.t!=="w"});
  const pick=e=>{const r=wc.getBoundingClientRect(),R=r.width/2,dx=e.clientX-r.left-R,dy=e.clientY-r.top-R,d=Math.hypot(dx,dy);
    H0=(Math.atan2(dy,dx)*180/Math.PI+360)%360;S0=Math.min(1,d/R);picked=true;setCol(hex(rgb(H0,S0,V0)))};
  let wd=false; wc.onpointerdown=e=>{wd=true;wc.setPointerCapture(e.pointerId);pick(e)}; wc.onpointermove=e=>{if(wd)pick(e)}; wc.onpointerup=()=>{wd=false;$("#pn").hidden=true};
  $("#bv").oninput=e=>{V0=e.target.value/100;wheel(wc,V0);if(picked)setCol(hex(rgb(H0,S0,V0)))};
  document.querySelectorAll(".sz").forEach(b=>b.onclick=()=>{w=+b.dataset.s;document.querySelectorAll(".sz").forEach(t=>t.classList.toggle("act",t===b))});
  $("#er").onclick=()=>{erase=!erase;fill=false;$("#er").classList.toggle("act",erase);$("#fl").classList.remove("act")};
  $("#fl").onclick=()=>{fill=!fill;erase=false;$("#fl").classList.toggle("act",fill);$("#er").classList.remove("act")};
  $("#u").onclick=()=>{if(hist.length){redo.push(x.getImageData(0,0,W,H));x.putImageData(hist.pop(),0,0);save()}};
  $("#rd").onclick=()=>{if(redo.length){hist.push(x.getImageData(0,0,W,H));x.putImageData(redo.pop(),0,0);save()}};
  $("#cl").onclick=()=>{if(!confirm("¿Borrar todo el dibujo?"))return;redo.length=0;hist.push(x.getImageData(0,0,W,H));if(hist.length>10)hist.shift();x.fillStyle="#fff";x.fillRect(0,0,W,H);$("#pn").hidden=true;save()};
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);$("#pn").hidden=true;hist.push(x.getImageData(0,0,W,H));if(hist.length>10)hist.shift();redo.length=0;if(fill){const[a,b]=pos(e);flood(x,a,b,col,W,H);return;}on=true;
    x.strokeStyle=erase?"#fff":col;x.lineWidth=erase?w*1.6:w;[lx,ly]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(lx+.1,ly);x.stroke();};
  cv.onpointermove=e=>{if(!on)return;const[a,b]=pos(e),mx=(lx+a)/2,my=(ly+b)/2;x.quadraticCurveTo(lx,ly,mx,my);x.stroke();x.beginPath();x.moveTo(mx,my);lx=a;ly=b;};
  cv.onpointerup=cv.onpointercancel=()=>{on=false;save()};
  // Borrador: el dibujo se guarda en el móvil según dibujas, así que si la página se recarga no se pierde.
  const dk="draft:"+key.slice(6), save=()=>{try{ls(dk,cv.toDataURL("image/jpeg",0.6))}catch(e){}};
  let ready=Promise.resolve(); const dr=ls(dk);
  if(dr) ready=new Promise(res=>{const im=new Image(); im.onload=()=>{x.drawImage(im,0,0,W,H);res()}; im.onerror=res; im.src=dr});
  const blankNow=()=>{const d=x.getImageData(0,0,W,H).data;for(let i=0;i<d.length;i+=4)if(d[i]<255||d[i+1]<255||d[i+2]<255)return false;return true};
  let sent=false;
  const fin=async()=>{ if(sent) return; sent=true; clearInterval(timer); await ready; $("#tm").textContent="Enviando…";
    try{ await send(view, blankNow()?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",0.6), blankNow()?null:cropOf(cv,x,W,H)); try{localStorage.removeItem(dk)}catch(e){} render(); }
    catch(e){ sent=false; $("#tm").textContent="Error al enviar, reintentando…"; setTimeout(fin,2000);} };
  // Al acabar el tiempo con el lienzo vacío no se gasta el intento: se ofrece empezar de nuevo.
  const timeUp=async()=>{ if(sent) return; clearInterval(timer); await ready;
    if(blankNow()&&confirm("Se acabó el tiempo y el lienzo está vacío. ¿Empezar de nuevo con otros "+SECONDS+" segundos?\n\nAceptar = empezar de nuevo · Cancelar = enviarlo en blanco")){
      ls(key,Date.now()); try{localStorage.removeItem(dk)}catch(e){} render(); return; }
    fin(); };
  $("#ok").onclick=()=>{ if(confirm("¿Enviar el dibujo? Solo hay un intento al día y no se podrá cambiar.")) fin(); };
  const tick=()=>{const left=Math.max(0,SECONDS-Math.floor((Date.now()-start)/1000)); $("#tm").textContent=left+" s"; if(left===0) timeUp();};
  tick(); timer=setInterval(tick,250);
}
render();
</script>
